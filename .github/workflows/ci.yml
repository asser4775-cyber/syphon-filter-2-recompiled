name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-source-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Audit repository contents
        run: python tools/public_repo_audit.py --root .
      - name: Exercise release-audit rejection paths
        run: python -m unittest discover -s tools -p 'test_*.py' -v

  framework-cli-and-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
      - name: Build pinned PSXRecomp CLI
        shell: msys2 {0}
        run: python psxrecomp/tools/build_cli.py release
      - name: Run registered recompiler tests
        shell: msys2 {0}
        run: ctest --test-dir psxrecomp/recompiler/build-cli --output-on-failure
      - name: Confirm CI did not generate retail code
        shell: pwsh
        run: |
          if (Test-Path generated) { throw "CI must not create generated SF2 code" }
          if (Test-Path input) { throw "CI must not acquire retail SF2 inputs" }
