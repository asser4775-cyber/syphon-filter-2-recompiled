# Keyboard mapping to the retail PS1 controller. Mouse movement controls the
# player-owned chase/aim camera; mouse buttons remain ordinary PAD actions.
[player1]
up        = W
down      = S
left      = Q
right     = E
cross     = C
circle    = Space
square    = Left Ctrl
triangle  = F
l1        = Left Alt
r1        = Tab
l2        = A
r2        = D
l3        = None
r3        = None
start     = Escape
select    = R
ls_up     = W
ls_down   = S
ls_left   = Q
ls_right  = E
rs_up     = None
rs_down   = None
rs_left   = None
rs_right  = None

[player2]
up = None
down = None
left = None
right = None
cross = None
circle = None
square = None
triangle = None
l1 = None
r1 = None
l2 = None
r2 = None
l3 = None
r3 = None
start = None
select = None
ls_up = None
ls_down = None
ls_left = None
ls_right = None
rs_up = None
rs_down = None
rs_left = None
rs_right = None
